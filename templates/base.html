<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#064E3B">
  <meta name="description" content="Qless is the smart campus canteen platform: pre-order, pick up in a 15-minute slot, and help the kitchen waste less.">
  <title>{% block title %}Qless{% endblock %}</title>

  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">

  <!-- Fonts: Outfit for headings, Inter for everything else -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">

  <!-- Design system: tokens first, then the shared styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  {# Each layout (public_base.html, app_base.html) fills in the page body #}
  {% block body %}{% endblock %}

  <!-- Lucide icons (loaded from a CDN) and our small helper script -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts_extra %}{% endblock %}
</body>
</html>
