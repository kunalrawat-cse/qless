{% extends "public_base.html" %}
{% from "partials/logo.html" import logo %}

{% block title %}Forgot password - Qless{% endblock %}

{% block content %}
  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-card__brand">
        {{ logo(style="stacked") }}
      </div>

      <div class="card">
        <h1>Forgot your password?</h1>
        <p class="text-soft">Enter your campus email and we will send you a 6-digit code.</p>

        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="form-field">
            <label for="email">Campus email</label>
            <input id="email" name="email" type="email" autocomplete="email" required autofocus>
          </div>

          <button class="btn btn--primary btn--full" type="submit">Send code</button>
        </form>

        <p class="auth-links"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
      </div>

    </div>
  </div>
{% endblock %}
