{% extends "base.html" %}

{% block title %}Reset password - Qless{% endblock %}

{% block content %}
  <h1>Reset your password</h1>
  <p>Enter the 6-digit code for <strong>{{ email }}</strong> and choose a new password.</p>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="otp_code">6-digit code</label>
    <input id="otp_code" name="otp_code" type="text" inputmode="numeric" maxlength="6" required autofocus>

    <label for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password" required>
    <small>At least 8 characters, with a letter and a number.</small>

    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" name="confirm_password" type="password" required>

    <button type="submit">Change password</button>
  </form>

  <p><a href="{{ url_for('auth.forgot_password') }}">Send a new code</a></p>
{% endblock %}
